name: M5 validation

on:
  push:
    branches: [codex/m5-intragroup]
  pull_request:
    branches: [backend]
    paths:
      - 'src/kalmora/ic/**'
      - 'tests/test_ic*'
      - 'tools/m5*'
      - '.github/workflows/m5-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record source and environment
        run: |
          mkdir -p m5-ci-evidence
          git rev-parse HEAD > m5-ci-evidence/commit.txt
          git rev-parse HEAD^{tree} > m5-ci-evidence/tree.txt
          python --version > m5-ci-evidence/python.txt
          git archive --format=tar HEAD > m5-ci-evidence/source.tar
          git bundle create m5-ci-evidence/source.bundle HEAD
          sha256sum m5-ci-evidence/source.tar m5-ci-evidence/source.bundle > m5-ci-evidence/SHA256SUMS
      - run: python -m pip install -e .
      - run: python -m compileall -q src tools
      - name: Run complete backend unit suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee m5-ci-evidence/tests.log
      - run: kalmora doctor
      - run: git diff --check
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-ci-${{ github.sha }}-py${{ matrix.python }}
          path: m5-ci-evidence/
          retention-days: 14

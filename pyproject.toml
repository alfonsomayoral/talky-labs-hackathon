[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalmora-close"
version = "0.1.1"
description = "Reproducible accounting close for the Kalmora hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
documents = ["pypdf[image]==6.19.0", "pillow==12.3.0"]
llm = ["pydantic-ai-slim[openai]==2.54.0", "openai==3.24.0", "pydantic==2.13.5"]
landing = ["duckdb==1.5.5"]

[project.scripts]
kalmora = "kalmora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalmora = ["landing/*.sql"]
